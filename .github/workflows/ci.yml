name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel a still-running CI run for this branch/PR when a new commit lands
# on it, instead of letting both run to completion. Without this, rapid
# successive pushes spawn overlapping e2e runs that all target the SAME
# live E2E Supabase project (not per-run isolated) — two runs' global-setup/
# global-teardown can race and delete [E2E]-prefixed seed rows out from
# under each other's still-in-progress tests, surfacing as unexplained
# "did not find some options" / element-not-found flakes that have nothing
# to do with the actual code under test.
#
# Not scoped to github.ref — github.ref differs between a pull_request event
# (refs/pull/<pr>/merge) and a push event for the same branch/commit
# (refs/heads/<branch>), so a per-ref group lets a push run and a
# pull_request run for the same change execute concurrently, which is
# exactly the race this block exists to prevent. A single group for the
# whole workflow serializes every run (across all branches and PRs) that
# touches the shared E2E Supabase project.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# ── Two supply-chain conventions used by every job below ────────────────────
#
# 1. pnpm/action-setup is pinned to a full commit SHA, not the `v4` tag. A tag
#    is mutable: whoever controls the repo can repoint `v4` at new code, which
#    then runs here with the job's secrets. The SHA below is what `v4` resolved
#    to when it was pinned (2026-03-11, "Revert feat!: run the action on
#    Node.js 24"), so this changed nothing about what CI executes — it only
#    removed the ability for it to change without a commit here.
#    actions/* are GitHub-owned and left on tags deliberately.
#    To bump: resolve the tag to a commit SHA and update every occurrence.
#
# 2. `pnpm install` passes --ignore-scripts so a compromised transitive
#    dependency cannot execute arbitrary code during install. Verified safe
#    against the current dependency set: exactly four packages have install
#    hooks (@playwright/browser-chromium, @sentry/cli, protobufjs,
#    unrs-resolver), and with all four skipped, check:ui-classes, tsc, lint,
#    the full vitest suite, and next build all pass. The one hook that
#    matters — the Chromium download — is redundant here because the e2e job
#    runs `playwright install --with-deps chromium` as its own explicit step.
#    If a future dependency genuinely needs its postinstall, this flag is
#    where to look: the failure will not name it.
#
# Both are enforced by SonarCloud rules githubactions:S7637 and S6505.
# ────────────────────────────────────────────────────────────────────────────
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:ui-classes
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  # ── Semgrep (structural enforcement, AST layer) ──────────────────────────
  # Two rule families, gated differently on purpose — see .semgrep/README.md.
  #
  #   .semgrep/chokepoints.yml — capabilities with exactly ONE legitimate owner
  #     (service role key, Telnyx, raw limiter, role-filtered
  #     organization_members reads, untimed outbound fetch, private-bucket
  #     getPublicUrl, `void` on a lazy PostgREST builder, tables/columns that do
  #     not exist). Currently ZERO findings, so this gates at --error across the
  #     WHOLE tree, not just the diff: a violation anywhere fails the build
  #     immediately. The last two were promoted out of ratchet.yml once their
  #     counts reached 0 — that promotion is what the ratchet is for.
  #
  #   .semgrep/ratchet.yml — defect classes with hundreds of pre-existing sites
  #     (the unbounded-select ladder's remaining three tiers — tier 1 reached 0
  #     and was promoted to chokepoints.yml — discarded write results, reads
  #     destructured without `error`). Gated on --baseline-commit so only
  #     findings NEW relative to the PR base fail, plus the committed per-rule
  #     counts in .semgrep/baseline-counts.json which may only go down.
  #
  # NOTE ON fetch-depth: --baseline-commit needs the base commit's objects in
  # the local clone. actions/checkout defaults to fetch-depth: 1, which fetches
  # only the merge commit — semgrep then cannot resolve the baseline and the
  # gate silently degrades. `fetch-depth: 0` is load-bearing, not tidiness.
  #
  # No `pnpm install`: semgrep comes from pip and
  # scripts/check-semgrep-ratchet.mjs uses Node builtins plus the semgrep
  # binary only. Verified by unit/guardrails/semgrep-enforcement.test.ts.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned. An unpinned semgrep turns a rule-engine release into an
      # unexplained CI failure on an unrelated PR.
      # --only-binary :all: refuses any sdist, so pip never builds from source
      # and never executes a package's setup.py during install. semgrep ships
      # wheels for this platform, so this costs nothing and closes the
      # arbitrary-code-execution-at-install-time path SonarQube flags.
      # Quoted: `:all:` is followed by a space, and an unquoted `: ` inside a
      # plain YAML scalar terminates the key. Unquoted, this single line makes
      # the WHOLE workflow file unparseable — GitHub then fails the run at
      # startup with zero jobs created, which renders as a generic red X that
      # looks like a normal test failure. CI was silently dead from c8e067f
      # until this was found, and a merge to main went through with no checks,
      # no semgrep, no db-invariants and no e2e having run at all.
      - run: "pip install --only-binary :all: semgrep==1.172.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chokepoint rules (whole tree, must stay at zero)
        run: semgrep --config .semgrep/chokepoints.yml --error --metrics off
      - name: Ratchet rules (fail only on findings NEW vs. the PR base)
        if: github.event_name == 'pull_request'
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fail loudly rather than silently scanning the whole tree if the
          # base commit is somehow absent — that is the exact fetch-depth
          # failure mode this job is written to avoid.
          git cat-file -e "$BASELINE_SHA^{commit}"
          semgrep --config .semgrep/ratchet.yml --error --metrics off \
            --baseline-commit "$BASELINE_SHA"
      - name: Ratchet counts may not increase
        run: node scripts/check-semgrep-ratchet.mjs

  # ── End-to-end (Playwright) ──────────────────────────────────────────────
  # STATUS: self-arming merge gate (launch-readiness audit B2 / 2026-07-22
  # audit recommendation #2). The first step detects whether the E2E secrets
  # are configured:
  #
  #   - Secrets ABSENT  → every remaining step is skipped and a prominent
  #     warning annotation marks the run "E2E gate unarmed". The job itself
  #     passes, so an unconfigured repo/fork isn't permanently red — but the
  #     warning makes the unarmed state impossible to mistake for coverage.
  #   - Secrets PRESENT → the suite runs for real and failures FAIL the job.
  #     No continue-on-error. Combined with branch protection (below), that
  #     makes this a true merge gate.
  #
  # To arm the gate, follow docs/E2E_SETUP.md end to end:
  #   1. Provision the dedicated E2E Supabase project (NOT production),
  #      apply all migrations, run scripts/seed-e2e-project.ts.
  #   2. Add the repo secrets listed there (Settings → Secrets and
  #      variables → Actions). E2E_* Supabase values must point at the E2E
  #      project — never production.
  #   3. Add this `e2e` job as a required status check in branch protection
  #      so a red suite blocks the merge button.
  e2e:
    runs-on: ubuntu-latest
    env:
      # `pnpm run e2e` builds and starts Next, which sets NODE_ENV=production.
      # Without this marker lib/env.ts classifies the run as a production
      # deploy and aborts boot over production-tier vars this job has no
      # reason to hold. resolveDeployTarget() only honours it when VERCEL_ENV
      # is unset, so a real deploy still gets full validation.
      FIELDSTAY_ENV_TARGET:          test
      NEXT_PUBLIC_APP_URL:           http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PM_EMAIL:                  ${{ secrets.E2E_PM_EMAIL }}
      E2E_PM_PASSWORD:               ${{ secrets.E2E_PM_PASSWORD }}
      E2E_CREW_EMAIL:                ${{ secrets.E2E_CREW_EMAIL }}
      E2E_CREW_PASSWORD:             ${{ secrets.E2E_CREW_PASSWORD }}
      STRIPE_SECRET_KEY:             ${{ secrets.STRIPE_SECRET_KEY }}
      RESEND_API_KEY:                ${{ secrets.RESEND_API_KEY }}
      MAPBOX_PUBLIC_TOKEN:           ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY:             ${{ secrets.VAPID_PRIVATE_KEY }}
      INNGEST_EVENT_KEY:             ${{ secrets.INNGEST_EVENT_KEY }}
      INNGEST_SIGNING_KEY:           ${{ secrets.INNGEST_SIGNING_KEY }}
    steps:
      # Gate detection — see the job comment above. Checks the three secrets
      # without which e2e/global-setup.ts cannot even start; the rest of the
      # E2E_* set is validated by global-setup itself with precise errors.
      - name: Detect whether the E2E gate is armed
        id: gate
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$E2E_PM_EMAIL" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "E2E gate is ARMED — suite failures will fail this job."
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E gate UNARMED::E2E secrets are not configured, so the Playwright suite did NOT run. Regressions in onboarding, PMS sync, and payment flows are not being caught. Follow docs/E2E_SETUP.md to arm the gate."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.armed == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.armed == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.gate.outputs.armed == 'true'
      # This is the step that makes --ignore-scripts safe above: the browser
      # arrives here explicitly rather than via @playwright/browser-chromium's
      # skipped install hook. `playwright install` downloads a browser — it is
      # not a package install and has no --ignore-scripts flag, so SonarCloud
      # S6505 flags it as a false positive.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.gate.outputs.armed == 'true'
      - run: pnpm run e2e
        if: steps.gate.outputs.armed == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.armed == 'true' && failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Database invariants (structural enforcement Tier 3) ──────────────────
  # Checks the live schema for what no code-side check can see: RLS enabled
  # on every public table, no unexpected policy-less (deny-all) tables, a
  # covering index on every FK column, zero anon table grants, and (the
  # former enforcement leftover, closed by check-type-drift.mjs) that
  # types/database.ts's enums/tables/columns still match the live schema.
  # Runs against the DEDICATED E2E project (same secrets as the e2e job —
  # CI never holds production credentials).
  #
  # This comment used to end "both projects receive every migration, so
  # invariants verified there hold for production by construction." That is
  # FALSE and is exactly what check-migration-ledger.mjs was added to measure:
  # on 2026-08-04 the E2E project's ledger diverged from supabase/migrations/
  # by 203 versions across the two directions. Its schema is current — the
  # bookkeeping is what drifted — but "both receive every migration" is an
  # assumption, not a guarantee, and an E2E pass is evidence about the E2E
  # project only. Verify production deliberately and read-only with
  # `pnpm run check:db-invariants:prod` / `check:migration-ledger:prod`.
  #
  # Self-disarming like the e2e job, but at the SCRIPT level rather than via a
  # separate gate-detection step: all three scripts print a `::warning …UNARMED`
  # annotation and exit 0 when NEXT_PUBLIC_SUPABASE_URL /
  # SUPABASE_SERVICE_ROLE_KEY are absent, so a fork PR or an unconfigured repo
  # gets the same loud-but-green outcome without repeating an `if:` guard on
  # every step. Verified by unit/guardrails/ci-gating.test.ts.
  #
  # NO `pnpm install` STEP, deliberately: all three scripts use only Node
  # builtins and global fetch (Node 22), so this job skips the install
  # entirely. That is safe only while it stays true —
  # unit/guardrails/ci-gating.test.ts fails LOCALLY if any of them grows a
  # bare-specifier import, which would otherwise break this job in CI and
  # nowhere else. Add an install step here if such a dependency is ever
  # genuinely needed.
  #
  # See scripts/check-db-invariants.mjs, scripts/check-type-drift.mjs and
  # scripts/check-migration-ledger.mjs for the check details.
  db-invariants:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Both scripts self-disarm (warn + exit 0) when the secrets are absent,
      # so a fork PR — which cannot read secrets — is not blocked by a
      # permanently red required check. That is deliberate and correct.
      #
      # It is also indistinguishable from a pass on a green run, which is how
      # "the DB gate is green" can mean "the DB gate did not run". On the
      # CANONICAL repo the secrets are always available, so an unarmed run
      # there is a misconfiguration, not a fork — make it fail loudly.
      # `head.repo.fork` is false for same-repo PRs and pushes; for a fork PR
      # it is true and this stays unset, preserving the disarm.
      DB_INVARIANTS_REQUIRE_ARMED: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
      # Stripe price drift gate. Deliberately OPT-IN, unlike the Supabase gate
      # above: the Supabase secrets already exist on this repo, the Stripe ones
      # may not. Requiring armed before they are configured turns a brand-new
      # check into a permanently red required check on every PR, which teaches
      # people to ignore it — the opposite of what a gate is for.
      #
      # Set the repo VARIABLE STRIPE_PRICE_DRIFT_ARMED=1 once STRIPE_SECRET_KEY
      # and the STRIPE_PRICE_* values are in place (see below — variables, not
      # secrets, are the right home for the price ids); from then on an unarmed run
      # fails loudly here exactly like the Supabase gate. Until then the script
      # warns and passes, so the comparison is visible in the log without
      # blocking.
      # STRIPE_SECRET_KEY is genuinely secret. The price IDs are NOT — they are
      # public identifiers that appear in client-side checkout, in URLs and in
      # the Stripe dashboard, so a repo VARIABLE is the right home for them:
      # visible in logs, editable without secret hygiene, and far less friction
      # than seven more secrets.
      #
      # `vars.X || secrets.X` accepts either, because these already exist in
      # Vercel and one of them (SPONSOR_MONTHLY) is already a GitHub secret —
      # that secret keeps working untouched. Vercel's env store and GitHub
      # Actions' are separate: a value being set in Vercel does NOT make it
      # available here, which is exactly why the first armed run saw only one
      # of the seven and reported the three live plan monthlies as drift.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_STARTER_MONTHLY:   ${{ vars.STRIPE_PRICE_STARTER_MONTHLY   || secrets.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_STARTER_ANNUAL:    ${{ vars.STRIPE_PRICE_STARTER_ANNUAL    || secrets.STRIPE_PRICE_STARTER_ANNUAL }}
      STRIPE_PRICE_GROWTH_MONTHLY:    ${{ vars.STRIPE_PRICE_GROWTH_MONTHLY    || secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_GROWTH_ANNUAL:     ${{ vars.STRIPE_PRICE_GROWTH_ANNUAL     || secrets.STRIPE_PRICE_GROWTH_ANNUAL }}
      STRIPE_PRICE_PORTFOLIO_MONTHLY: ${{ vars.STRIPE_PRICE_PORTFOLIO_MONTHLY || secrets.STRIPE_PRICE_PORTFOLIO_MONTHLY }}
      STRIPE_PRICE_PORTFOLIO_ANNUAL:  ${{ vars.STRIPE_PRICE_PORTFOLIO_ANNUAL  || secrets.STRIPE_PRICE_PORTFOLIO_ANNUAL }}
      STRIPE_PRICE_SPONSOR_MONTHLY:   ${{ vars.STRIPE_PRICE_SPONSOR_MONTHLY   || secrets.STRIPE_PRICE_SPONSOR_MONTHLY }}
      STRIPE_PRICE_DRIFT_REQUIRE_ARMED: ${{ (vars.STRIPE_PRICE_DRIFT_ARMED == '1' && !github.event.pull_request.head.repo.fork) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This job only reads the repo and runs four scripts — no reason to
          # leave the checkout token on disk.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-db-invariants.mjs
      - run: node scripts/check-type-drift.mjs
      - run: node scripts/check-migration-ledger.mjs
      - run: node scripts/check-stripe-price-drift.mjs
