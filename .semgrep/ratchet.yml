# ============================================================================
# FieldStay — RATCHET rules (structural enforcement, semgrep layer).
#
# A ratchet rule encodes a defect class with MANY legitimate owners spread
# across the tree. There is no single file to put in `paths.exclude`, and the
# current count is far above zero, so these cannot gate at `--error` on the
# whole tree without turning CI permanently red.
#
# They gate two ways instead:
#   1. `--baseline-commit` in CI — only findings NEW relative to the PR base
#      fail the build. Existing sites stay visible without blocking.
#   2. `.semgrep/baseline-counts.json` + `scripts/check-semgrep-ratchet.mjs` —
#      a committed per-rule count that may only go DOWN. This is what makes a
#      burn-down PR demonstrate progress instead of asserting it.
#
# Do NOT add `nosemgrep` comments or per-file excludes to shrink a ratchet
# count. Fix the site, or leave it counted. A suppressed rule is worse than no
# rule: it reports zero and means nothing.
# ============================================================================
rules:
  # ══ max_rows = 1000 silently truncates every unbounded select ════════════
  #
  # The single highest-impact systemic finding of the 2026-07-30 audit — and,
  # as one undifferentiated rule, 284 findings of which the majority were
  # explicitly permitted by CLAUDE.md ("Fine for a request handler rendering
  # one org's page; never acceptable for a platform-wide scan"). A rule whose
  # majority is permitted-by-policy noise is one people learn to ignore, so it
  # is split into a SEVERITY LADDER along the only axis that actually predicts
  # whether the 1000-row cap can be reached: what bounds the result set.
  #
  #   1   -table-scan     nothing bounds it but the table itself         ERROR
  #   2   -cross-tenant   no org scope AND no parent row                 ERROR
  #   2b  -single-parent  one non-org parent row, no org scope         WARNING
  #   2c  -global-table   a table with no org_id column to scope to       INFO
  #   3   -in-list        one org, but sized by a caller-supplied .in() WARNING
  #   4   -org-scoped     one org, one parent entity — the permitted case  INFO
  #
  # The tiers are mutually exclusive and partition the original rule exactly:
  # every finding lands in exactly one tier, so the ratchet counts still sum
  # to the whole class and no site can be lost between tiers. Mutual exclusion
  # is ENFORCED by scripts/check-semgrep-ratchet.mjs, not asserted here — the
  # 2c/2b overlap this split introduced (one site matching both, inflating the
  # ladder total by one) is exactly what a comment cannot catch.
  #
  # Tiers 1, 2 and 2c all reached 0 and now live in chokepoints.yml, gating at
  # --error across the whole tree: -table-scan on 2026-08-01, -cross-tenant on
  # 2026-08-02, -global-table on 2026-08-07 (its 5 sites bounded with an
  # explicit .limit() / fetchAllRows(), an actual burn-down unlike tier 2's
  # split below). None of the three is defined in this file any more; the
  # ladder rows above are kept so the tier numbering still reads as one
  # sequence.
  #
  # Tier 2 reached 0 by the 2b/2c split, not by fixing sites — the 53 findings
  # it held were 47 parent-scoped reads and 5 reads of tables with no org_id,
  # plus one correctly org-scoped read the rule could not see (below). NONE was
  # a real cross-tenant scan. Those 52 reads are still counted here (in 2b, and
  # in chokepoints.yml's promoted 2c).
  #
  # NOTE on the shared exclusions, which every tier repeats:
  # `$S.from($T).select(...)` only matches a select whose receiver is the
  # `.from()` call itself, i.e. a READ. A write's returning-clause
  # (`.from(t).insert(y).select()`) has `.insert(y)` as the receiver and never
  # matches, so no insert/update/upsert/delete exclusion is needed. The
  # bounding calls must be `pattern-not-inside: $X.limit(...)` (not
  # `$S.from($T).select(...).limit(...)`): in a real chain the two are
  # separated by .eq()/.order()/.in() etc., so the adjacent form matches
  # almost nothing while the enclosing-call form correctly treats the select
  # as a syntactic descendant of the terminator. The same applies to the
  # POSITIVE `pattern-inside: $Y.eq("org_id", ...)` the lower tiers use to
  # assert single-tenant scope. That positive form must NOT be wrapped in a
  # `pattern-either` — semgrep then emits the enclosing call's range as a
  # finding in its own right and the count inflates several-fold (591 instead
  # of 81 when it was tried). Two sibling `pattern-inside`s AND correctly and
  # do not inflate, which is how tier 3 requires org scope and an .in() list
  # at once.
  #
  # `.in('org_id', …)` is deliberately NOT treated as org scope anywhere below:
  # all five occurrences in the tree are multi-tenant cron fan-ins, which is
  # the high-signal case, not the permitted one.
  #
  # lib/inngest/** gets no tier of its own. It is already gated at file
  # granularity by unit/guardrails/unbounded-select.test.ts on a shrink-only
  # baseline, so a duplicate cron tier would add a number without adding
  # coverage — and the ladder already promotes half of lib/inngest's findings
  # into the top two tiers on merit rather than by path.


  # ── What counts as org scope, and why the regex is not just "org_id" ─────
  # The org-scope negative below matches BOTH `.eq('org_id', …)` and an
  # embedded-resource filter like `.eq('checklist_templates.org_id', …)`, which
  # PostgREST uses to filter a parent through an `!inner` join. The literal
  # `pattern-not-inside: $X.eq("org_id", ...)` this replaced saw only the
  # undotted form, so
  #
  #   .from('checklist_template_sections')
  #   .select('template_id, checklist_templates!inner(...)')
  #   .eq('checklist_templates.org_id', membership.org_id)
  #
  # — a correctly single-tenant read — was counted as a cross-tenant scan.
  # A dotted org filter IS org scope; the tenant boundary does not care which
  # side of the join carries the column.
  #
  # ── Tier 2b: one parent entity, but no org filter ────────────────────────
  # `.eq('property_id', …)` / `.eq('work_order_id', …)` / `.eq('user_id', …)`
  # with no org scope. The row count is bounded by ONE parent row's children,
  # not by the platform, so this is a materially different risk class from a
  # genuinely unscoped scan — a work order's line items or a crew member's
  # availability does not approach max_rows.
  #
  # It is NOT zero-risk, which is why it stays counted rather than excluded:
  # the parent id arrives from somewhere, and if that somewhere is not itself
  # org-checked the read is an IDOR regardless of how few rows it returns.
  # That is an authorization question this rule cannot answer — see the
  # Manual Audit Checklist's IDOR entry in CLAUDE.md.
  - id: fieldstay-supabase-unbounded-select-single-parent
    languages: [typescript]
    severity: WARNING
    message: >-
      Unbounded .select() scoped to a single parent row (property_id,
      work_order_id, user_id, …) but with no .eq('org_id', …). Bounded by one
      parent's children rather than by the platform, so truncation is unlikely
      — but verify the parent id was itself org-checked before it got here,
      and add org scope if this table carries one.
    patterns:
      - pattern: $S.from($T).select(...)
      - pattern-inside:
          patterns:
            - pattern: $Y.eq($PCOL, ...)
            - metavariable-regex:
                metavariable: $PCOL
                regex: ^["'](?:[A-Za-z_]+\.)?(?!org_id)[A-Za-z_]*_id["']$
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      # A paginating callback IS the bound, even when the builder splits the
      # chain across statements.
      #
      # `pattern-not-inside: $X.range(...)` above only sees a SINGLE expression
      # — `supabase.from(t).select(...)….range(from, to)`. A read that needs a
      # CONDITIONAL filter cannot be written that way: supabase-js puts
      # .eq/.in on PostgrestFilterBuilder and .order/.range on
      # PostgrestTransformBuilder, so filters must precede transforms, and an
      # optional filter therefore forces
      #     let q = supabase.from(t).select(…)…
      #     if (cond) q = q.in('id', ids)
      #     return q.order('id').range(from, to)
      # — three statements, .select() in the first, .range() in the third.
      #
      # Those reads are bounded, and the ratchet was punishing the fix: two of
      # them were reported as NEW findings by the very commit that bounded
      # them. They had been unbounded, they were already counted in the
      # baseline, and moving them into fetchAllRows() changed their
      # fingerprints, so `--baseline-commit` saw new findings while the total
      # for the class went DOWN (76 -> 73).
      #
      # `pattern-not-inside`, not `paths.exclude` — the distinction
      # .semgrep/README.md draws: exclude expresses OWNERSHIP, not-inside
      # expresses HANDLING. Sitting inside a paginating callback is handling,
      # exactly as sitting inside `.limit()` is.
      #
      # Matched by SHAPE, not by callee name, because the name cannot be
      # matched here: every real call site is generic
      # (`fetchAllRows<{ id: string }>(…)`), and a generic type argument makes
      # both a literal `fetchAllRows(...)` pattern and a `metavariable-regex`
      # on the callee fail to match at all. Verified against a scratch fixture
      # before settling on this form.
      #
      # Three things must hold together, and none may be relaxed alone:
      #   1. a two-parameter callback,
      #   2. whose body RETURNS `<expr>.range($FROM, $TO)` using those same two
      #      parameters — so the page window is genuinely driven by the wrapper,
      #   3. and a second argument carrying `label`, i.e. PaginateOptions, the
      #      contract of fetchAllRows / foldAllRows / fetchDistinctOrgIds.
      # Dropping (3) exempts any function that happens to take such a callback;
      # dropping (2) exempts a callback that never paginates — the
      # over-permissive version of this same exemption, which was caught by
      # canary in unit/guardrails/unbounded-select.test.ts when the sibling
      # check there had precisely that hole. A decoy
      # `notAPaginator((from, to) => { … return q.range(from, to) })` is
      # correctly NOT exempted.
      - pattern-not-inside: |
          $PAGINATE(($FROM, $TO) => { ... return $Q.range($FROM, $TO) }, { ..., label: $LABEL, ... })
      - pattern-not-inside: $X.single(...)
      - pattern-not-inside: $X.maybeSingle(...)
      - pattern-not: "$S.from($T).select($SEL, {..., head: true, ...})"
      - pattern-not-inside:
          patterns:
            - pattern: $X.eq($OCOL, ...)
            - metavariable-regex:
                metavariable: $OCOL
                regex: ^["'](?:[A-Za-z_]+\.)?org_id["']$
      # A global table wins over parent scope — tier 2c. Without this,
      # platform_inventory_template_items filtered by
      # platform_inventory_template_id matched BOTH tiers and inflated the
      # ladder's total by one. The tiers are mutually exclusive by design.
      - metavariable-regex:
          metavariable: $T
          regex: ^(?!["'](?:asset_type_standards|integration_providers|inventory_catalog|maintenance_catalog_items|oauth_states|pending_integration_links|pending_oauth_authorizations|platform_admins|platform_inventory_template_items|platform_inventory_templates|platform_seed_room_template_items|platform_seed_room_templates|platform_staff|processed_webhooks|profiles|promo_hospitable_launch_counter|stripe_processed_events|support_kb_chunks)["']$)

  # ── Tier 2c (HYGIENE): a table that has no org_id column ─────────────────
  # Reached 0 on 2026-08-07 and PROMOTED to chokepoints.yml — see that file
  # for the surviving rule and history. Kept here as a ladder-row marker only,
  # same treatment as tiers 1 and 2 above.

  # ── Tier 3: one org, but sized by a caller-supplied list ─────────────────
  # `.eq('org_id', …)` plus `.in(col, array)`. Single-tenant, so it is not a
  # cross-tenant scan — but the row count scales with the ARRAY, not with a
  # single parent entity, and the array is caller- or query-derived. Rows can
  # be a multiple of the list length (one org's inventory_items across 50
  # properties is ~5,750 rows, well past the cap). Lower severity than tier 2
  # because the ceiling is a tenant's data rather than the platform's, but
  # these are real: it is the tier holding the confirmed true positives in
  # inventory/actions.ts, maintenance/actions.ts and upsert-normalized.ts.
  - id: fieldstay-supabase-unbounded-select-in-list
    languages: [typescript]
    severity: WARNING
    message: >-
      Unbounded .select() whose size scales with an .in(col, array) list rather
      than a single parent row. One tenant's rows across a long list can exceed
      max_rows = 1000 (one org's inventory_items across 50 properties already
      does). Chunk the list, or bound the read with fetchAllRows() / .limit().
    patterns:
      - pattern: $S.from($T).select(...)
      # dotted-aware, same as tier 2 — an embedded `rel.org_id` filter is org
      # scope. A nested `patterns:` block is safe here; it is `pattern-either`
      # that inflates the count, per the note above.
      - pattern-inside:
          patterns:
            - pattern: $Y.eq($OCOL, ...)
            - metavariable-regex:
                metavariable: $OCOL
                regex: ^["'](?:[A-Za-z_]+\.)?org_id["']$
      - pattern-inside: $Z.in($COL, $ARR)
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      # A paginating callback IS the bound, even when the builder splits the
      # chain across statements.
      #
      # `pattern-not-inside: $X.range(...)` above only sees a SINGLE expression
      # — `supabase.from(t).select(...)….range(from, to)`. A read that needs a
      # CONDITIONAL filter cannot be written that way: supabase-js puts
      # .eq/.in on PostgrestFilterBuilder and .order/.range on
      # PostgrestTransformBuilder, so filters must precede transforms, and an
      # optional filter therefore forces
      #     let q = supabase.from(t).select(…)…
      #     if (cond) q = q.in('id', ids)
      #     return q.order('id').range(from, to)
      # — three statements, .select() in the first, .range() in the third.
      #
      # Those reads are bounded, and the ratchet was punishing the fix: two of
      # them were reported as NEW findings by the very commit that bounded
      # them. They had been unbounded, they were already counted in the
      # baseline, and moving them into fetchAllRows() changed their
      # fingerprints, so `--baseline-commit` saw new findings while the total
      # for the class went DOWN (76 -> 73).
      #
      # `pattern-not-inside`, not `paths.exclude` — the distinction
      # .semgrep/README.md draws: exclude expresses OWNERSHIP, not-inside
      # expresses HANDLING. Sitting inside a paginating callback is handling,
      # exactly as sitting inside `.limit()` is.
      #
      # Matched by SHAPE, not by callee name, because the name cannot be
      # matched here: every real call site is generic
      # (`fetchAllRows<{ id: string }>(…)`), and a generic type argument makes
      # both a literal `fetchAllRows(...)` pattern and a `metavariable-regex`
      # on the callee fail to match at all. Verified against a scratch fixture
      # before settling on this form.
      #
      # Three things must hold together, and none may be relaxed alone:
      #   1. a two-parameter callback,
      #   2. whose body RETURNS `<expr>.range($FROM, $TO)` using those same two
      #      parameters — so the page window is genuinely driven by the wrapper,
      #   3. and a second argument carrying `label`, i.e. PaginateOptions, the
      #      contract of fetchAllRows / foldAllRows / fetchDistinctOrgIds.
      # Dropping (3) exempts any function that happens to take such a callback;
      # dropping (2) exempts a callback that never paginates — the
      # over-permissive version of this same exemption, which was caught by
      # canary in unit/guardrails/unbounded-select.test.ts when the sibling
      # check there had precisely that hole. A decoy
      # `notAPaginator((from, to) => { … return q.range(from, to) })` is
      # correctly NOT exempted.
      - pattern-not-inside: |
          $PAGINATE(($FROM, $TO) => { ... return $Q.range($FROM, $TO) }, { ..., label: $LABEL, ... })
      - pattern-not-inside: $X.single(...)
      - pattern-not-inside: $X.maybeSingle(...)
      - pattern-not: "$S.from($T).select($SEL, {..., head: true, ...})"

  # ── Tier 4 (HYGIENE): one org, one parent entity ─────────────────────────
  # `.eq('org_id', …)` and no list. This is precisely the case CLAUDE.md
  # permits — a request handler rendering one 10–50-property tenant's page.
  # Kept counted, at INFO, so the class stays visible and cannot grow, but
  # deliberately at a severity that does not compete with tiers 1–3 for
  # attention. Do NOT promote a fix here over a tier-1 finding.
  - id: fieldstay-supabase-unbounded-select-org-scoped
    languages: [typescript]
    severity: INFO
    message: >-
      Unbounded .select() scoped to a single org. Permitted by CLAUDE.md for a
      request handler rendering one tenant's page — counted as hygiene only, so
      the class cannot grow. Bound it if this table can hold >1000 rows for one
      org, or if this code can ever run platform-wide.
    patterns:
      - pattern: $S.from($T).select(...)
      # dotted-aware, same as tiers 2 and 3
      - pattern-inside:
          patterns:
            - pattern: $Y.eq($OCOL, ...)
            - metavariable-regex:
                metavariable: $OCOL
                regex: ^["'](?:[A-Za-z_]+\.)?org_id["']$
      - pattern-not-inside: $Z.in($COL, $ARR)
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      # A paginating callback IS the bound, even when the builder splits the
      # chain across statements.
      #
      # `pattern-not-inside: $X.range(...)` above only sees a SINGLE expression
      # — `supabase.from(t).select(...)….range(from, to)`. A read that needs a
      # CONDITIONAL filter cannot be written that way: supabase-js puts
      # .eq/.in on PostgrestFilterBuilder and .order/.range on
      # PostgrestTransformBuilder, so filters must precede transforms, and an
      # optional filter therefore forces
      #     let q = supabase.from(t).select(…)…
