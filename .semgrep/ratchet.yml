# ============================================================================
# FieldStay — RATCHET rules (structural enforcement, semgrep layer).
#
# A ratchet rule encodes a defect class with MANY legitimate owners spread
# across the tree. There is no single file to put in `paths.exclude`, and the
# current count is far above zero, so these cannot gate at `--error` on the
# whole tree without turning CI permanently red.
#
# They gate two ways instead:
#   1. `--baseline-commit` in CI — only findings NEW relative to the PR base
#      fail the build. Existing sites stay visible without blocking.
#   2. `.semgrep/baseline-counts.json` + `scripts/check-semgrep-ratchet.mjs` —
#      a committed per-rule count that may only go DOWN. This is what makes a
#      burn-down PR demonstrate progress instead of asserting it.
#
# Do NOT add `nosemgrep` comments or per-file excludes to shrink a ratchet
# count. Fix the site, or leave it counted. A suppressed rule is worse than no
# rule: it reports zero and means nothing.
# ============================================================================
rules:
  # ══ max_rows = 1000 silently truncates every unbounded select ════════════
  #
  # The single highest-impact systemic finding of the 2026-07-30 audit — and,
  # as one undifferentiated rule, 284 findings of which the majority were
  # explicitly permitted by CLAUDE.md ("Fine for a request handler rendering
  # one org's page; never acceptable for a platform-wide scan"). A rule whose
  # majority is permitted-by-policy noise is one people learn to ignore, so it
  # is split into a four-step SEVERITY LADDER along the only axis that
  # actually predicts whether the 1000-row cap can be reached: what bounds the
  # result set.
  #
  #   1  -table-scan    nothing bounds it but the table itself           ERROR
  #   2  -cross-tenant  bounded by some entity, but not by org           ERROR
  #   3  -in-list       one org, but sized by a caller-supplied .in()  WARNING
  #   4  -org-scoped    one org, one parent entity — the permitted case   INFO
  #
  # The four are mutually exclusive and partition the original rule exactly:
  # every finding lands in exactly one tier, so the ratchet counts still sum
  # to the whole class and no site can be lost between tiers.
  #
  # NOTE on the shared exclusions, which every tier repeats:
  # `$S.from($T).select(...)` only matches a select whose receiver is the
  # `.from()` call itself, i.e. a READ. A write's returning-clause
  # (`.from(t).insert(y).select()`) has `.insert(y)` as the receiver and never
  # matches, so no insert/update/upsert/delete exclusion is needed. The
  # bounding calls must be `pattern-not-inside: $X.limit(...)` (not
  # `$S.from($T).select(...).limit(...)`): in a real chain the two are
  # separated by .eq()/.order()/.in() etc., so the adjacent form matches
  # almost nothing while the enclosing-call form correctly treats the select
  # as a syntactic descendant of the terminator. The same applies to the
  # POSITIVE `pattern-inside: $Y.eq("org_id", ...)` the lower tiers use to
  # assert single-tenant scope. That positive form must NOT be wrapped in a
  # `pattern-either` — semgrep then emits the enclosing call's range as a
  # finding in its own right and the count inflates several-fold (591 instead
  # of 81 when it was tried). Two sibling `pattern-inside`s AND correctly and
  # do not inflate, which is how tier 3 requires org scope and an .in() list
  # at once.
  #
  # `.in('org_id', …)` is deliberately NOT treated as org scope anywhere below:
  # all five occurrences in the tree are multi-tenant cron fan-ins, which is
  # the high-signal case, not the permitted one.
  #
  # lib/inngest/** gets no tier of its own. It is already gated at file
  # granularity by unit/guardrails/unbounded-select.test.ts on a shrink-only
  # baseline, so a duplicate cron tier would add a number without adding
  # coverage — and the ladder already promotes half of lib/inngest's findings
  # into the top two tiers on merit rather than by path.


  # ── Tier 2: bounded by something, but not by tenant ──────────────────────
  # Has an equality filter, so it is not a bare table scan, but nothing pins
  # it to one org — the result set grows with the PLATFORM, not with a tenant.
  # Every one of these is a genuine truncation risk the moment tenant count
  # rises; CLAUDE.md's "fine for one org's page" exemption does not apply.
  - id: fieldstay-supabase-unbounded-select-cross-tenant
    languages: [typescript]
    severity: ERROR
    message: >-
      Unbounded .select() with no .eq('org_id', …) anywhere in the chain — this
      read spans tenants, so it grows with the platform and silently truncates
      at max_rows = 1000. Scope it to one org, or bound it with fetchAllRows()
      / .limit() / .single() / a head-count aggregate.
    patterns:
      - pattern: $S.from($T).select(...)
      - pattern-inside: $Y.eq($COL, ...)
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      - pattern-not-inside: $X.single(...)
      - pattern-not-inside: $X.maybeSingle(...)
      - pattern-not: "$S.from($T).select($SEL, {..., head: true, ...})"
      - pattern-not-inside: $X.eq("org_id", ...)

  # ── Tier 3: one org, but sized by a caller-supplied list ─────────────────
  # `.eq('org_id', …)` plus `.in(col, array)`. Single-tenant, so it is not a
  # cross-tenant scan — but the row count scales with the ARRAY, not with a
  # single parent entity, and the array is caller- or query-derived. Rows can
  # be a multiple of the list length (one org's inventory_items across 50
  # properties is ~5,750 rows, well past the cap). Lower severity than tier 2
  # because the ceiling is a tenant's data rather than the platform's, but
  # these are real: it is the tier holding the confirmed true positives in
  # inventory/actions.ts, maintenance/actions.ts and upsert-normalized.ts.
  - id: fieldstay-supabase-unbounded-select-in-list
    languages: [typescript]
    severity: WARNING
    message: >-
      Unbounded .select() whose size scales with an .in(col, array) list rather
      than a single parent row. One tenant's rows across a long list can exceed
      max_rows = 1000 (one org's inventory_items across 50 properties already
      does). Chunk the list, or bound the read with fetchAllRows() / .limit().
    patterns:
      - pattern: $S.from($T).select(...)
      - pattern-inside: $Y.eq("org_id", ...)
      - pattern-inside: $Z.in($COL, $ARR)
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      - pattern-not-inside: $X.single(...)
      - pattern-not-inside: $X.maybeSingle(...)
      - pattern-not: "$S.from($T).select($SEL, {..., head: true, ...})"

  # ── Tier 4 (HYGIENE): one org, one parent entity ─────────────────────────
  # `.eq('org_id', …)` and no list. This is precisely the case CLAUDE.md
  # permits — a request handler rendering one 10–50-property tenant's page.
  # Kept counted, at INFO, so the class stays visible and cannot grow, but
  # deliberately at a severity that does not compete with tiers 1–3 for
  # attention. Do NOT promote a fix here over a tier-1 finding.
  - id: fieldstay-supabase-unbounded-select-org-scoped
    languages: [typescript]
    severity: INFO
    message: >-
      Unbounded .select() scoped to a single org. Permitted by CLAUDE.md for a
      request handler rendering one tenant's page — counted as hygiene only, so
      the class cannot grow. Bound it if this table can hold >1000 rows for one
      org, or if this code can ever run platform-wide.
    patterns:
      - pattern: $S.from($T).select(...)
      - pattern-inside: $Y.eq("org_id", ...)
      - pattern-not-inside: $Z.in($COL, $ARR)
      - pattern-not-inside: $X.limit(...)
      - pattern-not-inside: $X.range(...)
      - pattern-not-inside: $X.single(...)
      - pattern-not-inside: $X.maybeSingle(...)
      - pattern-not: "$S.from($T).select($SEL, {..., head: true, ...})"

  # ── A discarded PostgREST result discards the ERROR ──────────────────────
  # `await supabase.from(x).update(y)` resolves with { error } instead of
  # throwing, so a surrounding try/catch cannot see the failure and neither
  # can Sentry. Highest-precision rule in this file.
  - id: fieldstay-supabase-discarded-result
    languages: [typescript]
    severity: WARNING
    message: >-
      This write's result is discarded. PostgREST RESOLVES with { error } — it
      does not throw — so a surrounding try/catch cannot catch it and nothing
      reaches Sentry. Destructure { error } and branch, or use the
      lib/supabase/unwrap.ts helpers.
    patterns:
      - pattern: await <... $S.from($T).$OP(...) ...>;
      - metavariable-regex:
          metavariable: $OP
          regex: ^(insert|update|upsert|delete|select|rpc)$
      - pattern-not-inside: $X = await ...
      - pattern-not-inside: return await ...
      - pattern-not-inside: const $X = await ...
      - pattern-not-inside: let $X = await ...
      - pattern-not-inside: var $X = await ...
      - pattern-not-inside: $F(await ...)
      - pattern-not-inside: await Promise.$M(...)

  # ── A read destructured without its error ────────────────────────────────
  # `const { data } = await …` collapses "the query errored" and "zero rows"
  # into the same null, so an RLS/GRANT regression renders a friendly empty
  # state with nothing logged. This is the ~481-site class that
  # unit/guardrails/supabase-error-handling.test.ts baselines.
  - id: fieldstay-supabase-read-without-error
    languages: [typescript]
    severity: WARNING
    message: >-
      `data` destructured without `error`. A failed query and an empty table
      are now indistinguishable. Use unwrap/unwrapList/tryUnwrap from
      lib/supabase/unwrap.ts, or destructure { data, error } and branch.
    patterns:
      - pattern-either:
          - pattern: "const { data } = await $Q"
          - pattern: "const { data: $D } = await $Q"
          - pattern: "const { data, count: $C } = await $Q"
          - pattern: "const { data: $D, count: $C } = await $Q"
      # Semgrep's JS object patterns match PARTIALLY — `const { data } = …`
      # also matches `const { data, error } = …`. Without these two negations
      # the rule reports every read in the repo, half of them already correct.
      - pattern-not: "const {..., error, ...} = await $Q"
      - pattern-not: "const {..., error: $E, ...} = await $Q"
      - metavariable-pattern:
          metavariable: $Q
          pattern: <... $S.from($T) ...>

  # ── The same class, in a Promise.all fan-in ──────────────────────────────
  # A separate rule because the metavariable-pattern that constrains the
  # single-read form to a `.from()` chain cannot bind through an array
  # destructure. Reported once per STATEMENT, not per element, and suppressed
  # entirely when any element in the statement binds `error` — both are
  # undercounts, never overcounts. unit/guardrails/supabase-error-handling.
  # test.ts counts these PER ELEMENT, which is one concrete reason that test
  # is not redundant with this ruleset.
  - id: fieldstay-supabase-read-without-error-fan-in
    languages: [typescript]
    severity: WARNING
    message: >-
      `data` destructured without `error` in a Promise.all fan-in. Every query
      in this batch that errors is indistinguishable from one that returned no
      rows. Use unwrap/unwrapList from lib/supabase/unwrap.ts.
    patterns:
      - pattern-either:
          - pattern: "const [..., { data: $D }, ...] = await Promise.all(...)"
          - pattern: "const [..., { data }, ...] = await Promise.all(...)"
      - pattern-not: "const [..., {..., error, ...}, ...] = await Promise.all(...)"
      - pattern-not: "const [..., {..., error: $E, ...}, ...] = await Promise.all(...)"

  # NOTE — two rules that used to live here, fieldstay-untimed-external-fetch
  # and fieldstay-role-filtered-membership-read, reached 0 findings and were
  # PROMOTED to chokepoints.yml, where they gate at --error across the whole
  # tree. See the entries there. Their baseline-counts.json keys are removed
  # with them: a ratchet entry for a rule that ratchet.yml no longer declares
  # is a number nobody can lower, and check-semgrep-ratchet.mjs fails on it.
