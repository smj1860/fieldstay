# ─────────────────────────────────────────────────────────────────────────────
# READING THE FINDINGS WITHOUT THE DASHBOARD
#
# The GitHub check "SonarCloud Code Analysis" reports only the failed quality
# GATE CONDITION (e.g. "D Reliability Rating on New Code") — its output.text is
# empty, so the check itself never names the rule, file or line. That is enough
# to know the build is red and not enough to fix it, which invites guessing at
# which rule fired. Don't; the project is public and the API answers directly:
#
#   curl -sS "https://sonarcloud.io/api/issues/search\
# ?componentKeys=smj1860_fieldstay&pullRequest=<PR>&types=BUG&ps=50"
#
# `types=BUG` for a Reliability failure, `VULNERABILITY` for Security,
# `CODE_SMELL` for Maintainability. Drop `types` for everything. No auth needed
# while the project stays public.
#
# Worth knowing which ratings mean what, since "D Reliability" sounds like a
# pile of problems and is not: the rating is set by the WORST single issue —
# A = none, B = minor, C = major, D = critical, E = blocker. One critical bug
# is a D on its own.
#
# WHICH CONDITION FAILED (not just that the gate is red):
#
#   curl -sS "https://sonarcloud.io/api/qualitygates/project_status\
# ?projectKey=smj1860_fieldstay&pullRequest=<PR>"
#
# Returns every condition with its actual value and threshold, so a
# "duplication 5.7% vs 3%" failure is not mistaken for a code problem. For a
# duplication failure, the BLOCKS are only available per file:
#
#   curl -sS "https://sonarcloud.io/api/duplications/show\
# ?key=smj1860_fieldstay:<path/to/file.ts>&pullRequest=<PR>"
#
# ⚠️ project_status CARRIES NO REVISION. It answers for whatever was analysed
# most recently, which after a fresh push is the PREVIOUS commit — so it will
# hand you a confident "OK" for code you have already replaced. Analysis lags
# the push by minutes and posts no check run in the meantime, so there is no
# in-band signal that the answer is stale. Confirm WHICH COMMIT was measured:
#
#   curl -sS "https://sonarcloud.io/api/project_pull_requests/list\
# ?project=smj1860_fieldstay"
#
# and match `.pullRequests[] | select(.key=="<PR>") | .commit.sha` against
# HEAD before believing the gate. This was got wrong on 2026-08-18 — a gate
# result was reported for the commit before the one under test.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# SonarQube Cloud — Automatic Analysis configuration
#
# This project is analysed by the SonarQube Cloud GitHub App in AUTOMATIC
# ANALYSIS mode (there is no sonar-scanner step in .github/workflows/ci.yml).
# In that mode SonarQube Cloud IGNORES sonar-project.properties and reads
# THIS file instead:
#
#   "If you import a project that already contains a sonar-project.properties
#    file, SonarQube Cloud will ignore the parameters in your
#    sonar-project.properties file."
#   — https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# sonar-project.properties is kept alongside this file, carrying the same
# exclusion and the full rationale, so the scope survives a later switch to
# CI-based analysis. Change one, change the other.
#
# The exclusion below suppresses ONLY migration files. See the comment block in
# sonar-project.properties for the full reasoning; in short:
#
#   • Five Blocker "WHERE clause is missing in this DELETE query" bugs against
#     20260730107000_fk_on_delete_corrections.sql (L30/37/46/52/63) are false
#     positives — those lines are `ON DELETE NO ACTION` referential actions on
#     ALTER TABLE ... ADD CONSTRAINT. The file has zero DELETE statements.
#     These five are the sole cause of the project's E Reliability rating.
#   • The duplicated-literal and full-table-scan LIKE findings on other
#     migrations are unactionable: an applied migration must never be edited
#     (CLAUDE.md migration discipline), and the LIKE is a one-time backfill.
#
# Application code stays fully in scope; no rule is suppressed globally.
# ─────────────────────────────────────────────────────────────────────────────

# ── Why types/database.generated.ts is excluded from DUPLICATION only ────────
#
# Added 2026-08-12, when a regeneration of that file failed the quality gate on
# "4.4% Duplication on New Code" with no hand-written duplication involved.
#
# The file is GENERATED from the live schema by `supabase gen types` and must
# never be hand-edited (see CLAUDE.md). Its FK relationship blocks are
# identical by construction — the same four lines
#
#     columns: ["org_id"]
#     isOneToOne: false
#     referencedRelation: "organizations"
#     referencedColumns: ["id"]
#
# repeat 37 times, once per org-scoped table, because 37 tables really do have
# an org_id FK. There is no edit that reduces this without desynchronising the
# types from the schema, which is the one thing the file exists to prevent.
#
# cpd.exclusions, NOT exclusions: bugs, vulnerabilities and code smells in the
# generated types stay in scope. Only copy-paste detection is switched off, and
# only for the one file whose repetition is a property of code generation
# rather than a maintenance problem. CodeRabbit already ignores it via
# `!**/*.generated.*`; this brings Sonar in line.

sonar.exclusions=supabase/migrations/**
sonar.cpd.exclusions=types/database.generated.ts
