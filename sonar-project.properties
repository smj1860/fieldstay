# ─────────────────────────────────────────────────────────────────────────────
# SonarQube Cloud analysis scope
#
# ⚠️ THIS FILE IS ONLY READ BY CI-BASED ANALYSIS (the sonar-scanner step).
#    SonarQube Cloud's Automatic Analysis — the GitHub App mode this project
#    uses today, with no sonar step in .github/workflows/ci.yml — explicitly
#    IGNORES sonar-project.properties. The equivalent settings that Automatic
#    Analysis DOES read live in `.sonarcloud.properties`, which is kept in
#    lockstep with this file. Change one, change the other.
#    See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# ── Why supabase/migrations/** is excluded ───────────────────────────────────
#
# 1. FIVE FALSE-POSITIVE BLOCKER BUGS, and they are the sole reason this
#    project's Reliability rating is E.
#    "Ensure that the WHERE clause is not missing in this DELETE query" was
#    raised against 20260730107000_fk_on_delete_corrections.sql at lines
#    30, 37, 46, 52 and 63. Every one of those lines is the referential-action
#    clause of an ALTER TABLE ... ADD CONSTRAINT:
#
#        FOREIGN KEY (property_id) REFERENCES public.properties(id) ON DELETE NO ACTION;
#
#    The file contains ZERO DELETE statements. Sonar's SQL parser is reading
#    the `ON DELETE` of a foreign-key action as a DELETE statement. There is
#    no code change that could fix this without changing the schema's meaning.
#
# 2. "Define a constant instead of duplicating this literal" and one
#    "LIKE causes a full table scan" are unactionable by construction.
#    An APPLIED migration must never be edited (CLAUDE.md migration
#    discipline) — every file here is already applied to both the production
#    and E2E projects, and rewriting one would desynchronise the local files
#    from live migration history. The LIKE is in a one-time backfill that has
#    already run once and will never run again.
#
# Deliberately narrow: application code (app/, lib/, components/) stays fully
# in scope, and no rule is suppressed globally. If a real SQL defect class
# ever needs coverage here, the right move is to re-scope this exclusion —
# not to add blanket rule suppressions.
# ─────────────────────────────────────────────────────────────────────────────

# ── Why types/database.generated.ts is excluded from DUPLICATION only ────────
#
# Added 2026-08-12, when a regeneration of that file failed the quality gate on
# "4.4% Duplication on New Code" with no hand-written duplication involved.
#
# The file is GENERATED from the live schema by `supabase gen types` and must
# never be hand-edited (see CLAUDE.md). Its FK relationship blocks are
# identical by construction — the same four lines
#
#     columns: ["org_id"]
#     isOneToOne: false
#     referencedRelation: "organizations"
#     referencedColumns: ["id"]
#
# repeat 37 times, once per org-scoped table, because 37 tables really do have
# an org_id FK. There is no edit that reduces this without desynchronising the
# types from the schema, which is the one thing the file exists to prevent.
#
# cpd.exclusions, NOT exclusions: bugs, vulnerabilities and code smells in the
# generated types stay in scope. Only copy-paste detection is switched off, and
# only for the one file whose repetition is a property of code generation
# rather than a maintenance problem. CodeRabbit already ignores it via
# `!**/*.generated.*`; this brings Sonar in line.

sonar.exclusions=supabase/migrations/**
sonar.cpd.exclusions=types/database.generated.ts
