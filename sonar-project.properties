# ─────────────────────────────────────────────────────────────────────────────
# SonarQube Cloud analysis scope
#
# ⚠️ THIS FILE IS ONLY READ BY CI-BASED ANALYSIS (the sonar-scanner step).
#    SonarQube Cloud's Automatic Analysis — the GitHub App mode this project
#    uses today, with no sonar step in .github/workflows/ci.yml — explicitly
#    IGNORES sonar-project.properties. The equivalent settings that Automatic
#    Analysis DOES read live in `.sonarcloud.properties`, which is kept in
#    lockstep with this file. Change one, change the other.
#    See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# ── Why supabase/migrations/** is excluded ───────────────────────────────────
#
# 1. FIVE FALSE-POSITIVE BLOCKER BUGS, and they are the sole reason this
#    project's Reliability rating is E.
#    "Ensure that the WHERE clause is not missing in this DELETE query" was
#    raised against 20260730107000_fk_on_delete_corrections.sql at lines
#    30, 37, 46, 52 and 63. Every one of those lines is the referential-action
#    clause of an ALTER TABLE ... ADD CONSTRAINT:
#
#        FOREIGN KEY (property_id) REFERENCES public.properties(id) ON DELETE NO ACTION;
#
#    The file contains ZERO DELETE statements. Sonar's SQL parser is reading
#    the `ON DELETE` of a foreign-key action as a DELETE statement. There is
#    no code change that could fix this without changing the schema's meaning.
#
# 2. "Define a constant instead of duplicating this literal" and one
#    "LIKE causes a full table scan" are unactionable by construction.
#    An APPLIED migration must never be edited (CLAUDE.md migration
#    discipline) — every file here is already applied to both the production
#    and E2E projects, and rewriting one would desynchronise the local files
#    from live migration history. The LIKE is in a one-time backfill that has
#    already run once and will never run again.
#
# Deliberately narrow: application code (app/, lib/, components/) stays fully
# in scope, and no rule is suppressed globally. If a real SQL defect class
# ever needs coverage here, the right move is to re-scope this exclusion —
# not to add blanket rule suppressions.
# ─────────────────────────────────────────────────────────────────────────────

# ── Why types/database.generated.ts is excluded from DUPLICATION only ────────
#
# Added 2026-08-12, when a regeneration of that file failed the quality gate on
# "4.4% Duplication on New Code" with no hand-written duplication involved.
#
# The file is GENERATED from the live schema by `supabase gen types` and must
# never be hand-edited (see CLAUDE.md). Its FK relationship blocks are
# identical by construction — the same four lines
#
#     columns: ["org_id"]
#     isOneToOne: false
#     referencedRelation: "organizations"
#     referencedColumns: ["id"]
#
# repeat 37 times, once per org-scoped table, because 37 tables really do have
# an org_id FK. There is no edit that reduces this without desynchronising the
# types from the schema, which is the one thing the file exists to prevent.
#
# cpd.exclusions, NOT exclusions: bugs, vulnerabilities and code smells in the
# generated types stay in scope. Only copy-paste detection is switched off, and
# only for the one file whose repetition is a property of code generation
# rather than a maintenance problem. CodeRabbit already ignores it via
# `!**/*.generated.*`; this brings Sonar in line.

# ── Why the three inspection form files are excluded from DUPLICATION only ───
#
# Added 2026-08-22, when lib/inspections/forms/{safety,indoor,outdoor}.ts failed
# the gate at 16.5% / 25.3% / 35.6% Duplication on New Code.
#
# THE REAL DUPLICATION IN THOSE FILES WAS FIXED FIRST, and it was worth fixing
# independently of Sonar. Indoor and Outdoor each carried a verbatim copy of the
# Property Assets and Sign-off sections — which docs/INSPECTIONS_SPEC.md
# describes as "Same as Indoor §7" and "Identical to Indoor", i.e. two copies
# that MUST stay identical with nothing enforcing it. They are now built by
# lib/inspections/forms/shared-sections.ts. That removed 73 duplicated lines
# from Indoor and 59 from Outdoor.
#
# WHAT REMAINS IS A TABLE LOOKING LIKE A TABLE. These files are the three
# inspection forms as data — 170 items, each a record with the same fields:
#
#     {
#       key:    'outdoor.grounds.fencing',
#       prompt: 'Perimeter fencing and gates sound, latching, no missing sections',
#       remediation: 'work_order', default_actions: ['repair'],
#       wo_category: 'landscaping',
#     },
#
# Sonar's copy-paste detector normalises string literals, so every run of
# consecutive items that happens to share a shape — and most do, because most
# items are "a work order, pre-ticked Repair, routed to one category" — reads as
# a duplicated block. Verified locally by reproducing its numbers with a
# literal-normalising 100-token scan: 67 / 191 / 130 lines against Sonar's
# 71 / 186 / 127.
#
# The only edit that would reduce it further is collapsing the records into
# positional constructors — `wo('...', '...', 'repair', 'landscaping')` — which
# trades away the one property these files exist for. §9 of the spec chose the
# repo over a migration specifically so a wording change is "reviewable in a
# pull request"; eight positional arguments is not that.
#
# cpd.exclusions, NOT exclusions: bugs, vulnerabilities and code smells in the
# form data stay in scope. And the three files are named individually rather
# than the directory globbed, so copy-paste detection stays ON for
# shared-sections.ts, index.ts and types.ts — the files where a copy-paste
# would be a genuine defect rather than a row in a table. A fourth form should
# be a deliberate addition to this list, not something a glob absorbs silently.


# ── Why lib/faq-content.ts is excluded from DUPLICATION only ─────────────────
#
# Added 2026-08-25, when adding an Inspections category to the in-app Help page
# failed the gate at 100% Duplication on New Code — all 54 added lines.
#
# THE SAME MECHANISM AS THE FORM FILES ABOVE, in its purest form. This file is
# the Help page's FAQ as data: ~50 records, every one of them
#
#     {
#       id:       'inspections-offline',
#       question: 'Do inspections work without cell service?',
#       answer:
#         'Yes, as long as the device has loaded the Inspections page ...',
#     },
#
# Normalise the string literals — which is what CPD does before hashing — and
# every entry in the file becomes the same token sequence. Seven consecutive
# entries clear the 100-token threshold, so each new entry matches a window
# somewhere among the entries already there. 100% is not "the new block repeats
# itself"; it is "an FAQ entry looks like an FAQ entry".
#
# Verified the same way as the form files, with a literal-normalising 100-token
# scan, and with a CONTROL, because a scan that reports duplication everywhere
# proves nothing on its own:
#
#     literals normalised (CPD's behaviour) → 54 / 54 new lines, = Sonar's 54
#     literals kept (control)               →  0 / 54
#
# Zero with literals intact is what rules out actual copy-paste in the added
# entries. And the file measured 45% duplicated (291/646 lines) BEFORE this
# change, so the shape is pre-existing — new code is simply the first thing
# that has ever been measured against it.
#
# There is no edit that reduces it. The records are already minimal — id,
# question, answer — and the only collapse available is positional tuples,
# which would take the FAQ copy out of reviewable-diff form. That copy is
# customer-facing support prose; being able to read a wording change in a pull
# request is the reason it lives in the repo rather than a CMS.
#
# cpd.exclusions, NOT exclusions: bugs, vulnerabilities and code smells in the
# FAQ data stay in scope. Named individually, not globbed — copy-paste
# detection stays ON for the rest of lib/, and for anything else that ends up
# beside it.

sonar.exclusions=supabase/migrations/**
sonar.cpd.exclusions=types/database.generated.ts,lib/inspections/forms/safety.ts,lib/inspections/forms/indoor.ts,lib/inspections/forms/outdoor.ts,lib/faq-content.ts
